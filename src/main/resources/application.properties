spring.application.name=PingCortex

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pingcortex}
spring.datasource.username=${DB_USER:pingcortex}
spring.datasource.password=${DB_PASSWORD:pingcortex}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

server.port=8080
server.servlet.context-path=/api

app.cookie.secure=false
app.cors.allowed-origins=${CLIENT_URL}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=30
jwt.refresh-token-expiration-days=30

app.encryption.master-key=${ENCRYPTION_MASTER_KEY}

ai.anthropic.base-url=https://api.anthropic.com
ai.anthropic.version=2023-06-01
ai.anthropic.model=claude-sonnet-4-5
ai.anthropic.max-tokens=4096

ai.gemini.base-url=https://generativelanguage.googleapis.com
ai.gemini.model=gemini-1.5-flash
ai.gemini.max-tokens=4096

ai.openai.base-url=https://api.openai.com
ai.openai.model=gpt-4o-mini
ai.openai.max-tokens=4096